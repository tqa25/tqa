<!doctype html>
<html lang="vi">
<head>  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HCMC Traffic – Player HLS / Fallback ảnh</title>
  <style>
    :root { --gap: 12px; }
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#0b0f14; color:#e6edf3; }
    header { position:sticky; top:0; background:#0b0f14cc; backdrop-filter:blur(6px); padding:12px 16px; border-bottom:1px solid #1f2937; display:flex; gap:10px; align-items:center; }
    h1 { font-size:18px; margin:0; font-weight:600; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
    .meta { font-size: 12px; color: #9fb3c8; margin-top: 6px; }
    .player { position:relative; background:#0b1220; border:1px solid #1f2937; border-radius:12px; overflow:hidden; }
    .player video, .player img { width:100%; height:auto; display:block; }
    .toolbar { display:flex; gap:8px; align-items:center; padding:10px 0; }
    button { background:#111827; color:#e6edf3; border:1px solid #253041; border-radius:10px; padding:8px 10px; cursor:pointer; }
    button:hover { background:#172033; }
    .status { font-size:12px; color:#9fb3c8; margin-left:auto; }
  </style>
  <!-- HLS.js để phát m3u8 trên Chrome/Edge/Firefox -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
<header>
  <h1>HCMC Traffic – Player</h1>
</header>

<div class="wrap">
  <div id="info" class="meta"></div>
  <div class="player" id="playerBox"></div>
  <div class="toolbar">
    <button id="btnToggleMode">Đổi chế độ (Video/Ảnh)</button>
    <button id="btnReload">Tải lại</button>
    <span class="status" id="status">—</span>
  </div>

  <p class="meta">
    Mẹo: Bạn có thể truyền tham số qua URL giống trang gốc, ví dụ:<br>
    <code>?camId=586e2995f9fab7001111b0b5&amp;camLocation=Ung%20Văn%20Khiêm%20-%20Nguyễn%20Gia%20Trí%20(D2)&amp;camMode=camera&amp;videoUrl=https://d2zihajmogu5jn.cloudfront.net/bipbop-advanced/bipbop_16x9_variant.m3u8</code>
  </p>
</div>

<script>
  // ====== Đọc tham số từ URL ======
  const qs = new URLSearchParams(location.search);
  const camId = qs.get('camId') || '586e2995f9fab7001111b0b5';
  const camLocation = decodeURIComponent(qs.get('camLocation') || 'Ung Văn Khiêm - Nguyễn Gia Trí (D2)');
  const camMode = (qs.get('camMode') || 'camera').toLowerCase();
  const videoUrl = qs.get('videoUrl') || ''; // nếu có m3u8 sẽ dùng ưu tiên

  // Endpoint ảnh snapshot từ trang gốc (đúng cổng 8007 và tên handler viết hoa)
  const SNAPSHOT_BASE = "https://giaothong.hochiminhcity.gov.vn:8007/Render/CameraHandler.ashx";
  const REFRESH_MS = 10_000; // ảnh tự refresh 10s khi ở chế độ ảnh

  const $info = document.getElementById('info');
  const $box = document.getElementById('playerBox');
  const $status = document.getElementById('status');
  const $btnToggle = document.getElementById('btnToggleMode');
  const $btnReload = document.getElementById('btnReload');

  // Trạng thái hiển thị hiện tại: "video" hoặc "image"
  let mode = videoUrl ? 'video' : 'image';
  let hls;         // instance Hls.js
  let refreshTick; // interval cho ảnh

  function setStatus(text){
    $status.textContent = text;
  }

  function snapshotUrl(id, w=640, h=360){
    const u = new URL(SNAPSHOT_BASE);
    u.searchParams.set('id', id);
    u.searchParams.set('bg', 'black');
    u.searchParams.set('w', w);
    u.searchParams.set('h', h);
    u.searchParams.set('t', Date.now()); // chống cache
    return u.toString();
  }

  function renderInfo(){
    const parts = [
      `Vị trí: <strong>${camLocation}</strong>`,
      `ID: <code>${camId}</code>`,
      `Chế độ: <strong>${mode.toUpperCase()}</strong>`,
      videoUrl ? `Video: <code>${videoUrl}</code>` : 'Video: <em>không có</em>'
    ];
    $info.innerHTML = parts.join(' &nbsp;|&nbsp; ');
  }

  function clearBox(){
    if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
    if (refreshTick) { clearInterval(refreshTick); refreshTick = null; }
    $box.innerHTML = '';
  }

  function showVideo(){
    clearBox();
    const video = document.createElement('video');
    video.setAttribute('controls','');
    video.setAttribute('playsinline','');
    video.setAttribute('muted','');
    $box.appendChild(video);

    if (!videoUrl) {
      setStatus('⚠️ Không có videoUrl; chuyển qua ảnh');
      mode = 'image';
      renderInfo();
      showImage();
      return;
    }

    if (Hls.isSupported()) {
      hls = new Hls({ maxBufferLength: 10 });
      hls.loadSource(videoUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(()=>{});
        setStatus('▶️ Video đang phát');
      });
      hls.on(Hls.Events.ERROR, (_, data) => {
        setStatus('⚠️ Lỗi HLS: ' + (data?.details || data?.type || ''));
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = videoUrl;
      video.addEventListener('loadedmetadata', () => {
        video.play().catch(()=>{});
        setStatus('▶️ Video (native) đang phát');
      });
    } else {
      setStatus('⚠️ Trình duyệt không hỗ trợ HLS; chuyển qua ảnh');
      mode = 'image';
      renderInfo();
      showImage();
    }
  }

  function showImage(){
    clearBox();
    const img = document.createElement('img');
    img.alt = camLocation;
    img.loading = 'lazy';
    img.referrerPolicy = 'no-referrer';
    img.addEventListener('load', () => setStatus('🖼️ Ảnh cập nhật: ' + new Date().toLocaleTimeString()));
    img.onerror = () => setStatus('⚠️ Không tải được ảnh');
    img.src = snapshotUrl(camId);
    $box.appendChild(img);

    // Auto-refresh ảnh mỗi REFRESH_MS
    refreshTick = setInterval(() => {
      img.src = snapshotUrl(camId);
    }, REFRESH_MS);
  }

  // Sự kiện nút
  $btnToggle.addEventListener('click', () => {
    mode = (mode === 'video') ? 'image' : 'video';
    renderInfo();
    if (mode === 'video') showVideo(); else showImage();
  });
  $btnReload.addEventListener('click', () => {
    if (mode === 'video') showVideo(); else showImage();
  });

  // Khởi tạo
  renderInfo();
  if (mode === 'video') showVideo(); else showImage();
</script>
</body>
</html>
